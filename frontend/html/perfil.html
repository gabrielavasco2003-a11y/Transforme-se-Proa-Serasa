<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - Spoiler Esperado</title>
    <link rel="stylesheet" href="../css/perfil.css">
</head>
<body>
    <header>
        <div id="logo">
            <img src="../../img/logo/Logotipo_Logo_ModoClaro.png" alt="Logo Spoiler Esperado">
        </div>

        <div id="search">
            <form onsubmit="event.preventDefault();">
                <input type="text" placeholder="Insira palavras-chave">
                <button type="submit">Pesquisar</button>
            </form>
        </div>
    </header>

    <main>
        <section id="perfil">
            <div class="perfil-header">
                <div class="perfil-esquerda">
                    <div id="avatar"></div>
                    <h2 id="nomePerfil">Carregando…</h2>
                </div>
                <button id="editar-perfil">
                    <a href="editar-perfil.html" class="btn">Editar perfil</a>
                </button>
            </div>

            <div class="perfil-info">
                <p><strong>Nome:</strong> <span id="nomeCompletoPerfil">—</span></p>
                <p><strong>E-mail:</strong> <span id="emailPerfil">—</span></p>
                <p><strong>Usuário:</strong> <span id="usuarioPerfil">—</span></p>
                <p><strong>Data de nascimento:</strong> <span id="nascimentoPerfil">—</span></p>
            </div>

            <div class="conquistas">
                <h3>Conquistas</h3>
                <div class="lista-conquistas"></div>
            </div>

            <!-- Prévia da Shelf -->
            <section id="previa-shelf" class="previa-shelf" role="link" tabindex="0"
                     aria-label="Ver minha shelf completa">
                <div class="previa-header">
                    <h3>Minha Shelf</h3>
                    <span class="ver-mais">Ver tudo →</span>
                </div>
                <div class="previa-lista" id="previaLista">
                    <p class="vazio">Carregando…</p>
                </div>
            </section>
        </section>
    </main>

    <footer>
        <div id="logo-footer">
            <img src="../../img/logo/Logo.svg" alt="Logo Spoiler Esperado">
        </div>
        <ul>
            <li><a href="#">Quem somos</a></li>
            <li><a href="#">Política de privacidade</a></li>
            <li><a href="#">Fale conosco</a></li>
        </ul>
        <div class="acoes">
            <button id="excluir-conta">Excluir conta</button>
            <button id="logout">Log Out</button>
        </div>
    </footer>

    <script src="../js/offline.js"></script>
    <script src="../js/perfil.js"></script>
</body>
</html>
