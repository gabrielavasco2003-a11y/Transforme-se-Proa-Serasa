<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Perfil - Spoiler Esperado</title>
    <!-- CSS correto -->
    <link rel="stylesheet" href="../css/perfil.css">
</head>
<body>
    <header>
        <div id="logo">
            <!-- Imagem está em Projeto/img -->
            <img src="../../img/logo/Logotipo_Logo_ModoClaro.png" alt="Logo Spoiler Esperado">
        </div>

        <div id="search">
            <form>
                <input type="text" placeholder="Insira palavras-chave">
                <button type="submit">Pesquisar</button>
            </form>
        </div>
    </header>

    <main>
        <section id="perfil">
            <div class="perfil-header">
                <div class="perfil-esquerda">
                    <div id="avatar"></div>
                    <h2>User_Name</h2>
                </div>
                <button id="editar-perfil">
                    <a href="editar-perfil.html" class="btn">Editar perfil</a>
                </button>
            </div>

            <div class="perfil-info">
                <p><strong>Nome:</strong> </p>
                <p><strong>Data de nascimento:</strong> </p>
            </div>

            <div class="conquistas">
                <h3>Conquistas</h3>
                <div class="lista-conquistas">
                    <!-- vazio por enquanto -->
                </div>
            </div>
        </section>

        <section id="estante">
            <div class="estante-header">
                <h2>Minha Estante</h2>
                <button id="ver-mais">Ver mais</button>
            </div>
            <div class="livros">
                <!-- vazio por enquanto -->
            </div>
        </section>
    </main>

    <footer>
        <div id="logo-footer">
            <!-- Imagem está em Projeto/img -->
            <img src="../../img/logo/Logo.svg" alt="Logo Spoiler Esperado">
        </div>
        <ul>
            <li><a href="#">Quem somos</a></li>
            <li><a href="#">Política de privacidade</a></li>
            <li><a href="#">Fale conosco</a></li>
        </ul>
        <div class="acoes">
            <button id="excluir-conta">Excluir conta</button>
            <button id="logout">Log Out</button>
        </div>
    </footer>

    <!-- JS correto -->
    <script src="../js/perfil.js"></script>
</body>
</html>
