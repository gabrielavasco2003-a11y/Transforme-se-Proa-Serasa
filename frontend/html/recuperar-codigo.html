<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperação de Senha</title>
  <link rel="stylesheet" href="../css/recuperar-codigo.css">
</head>
<body>
  <div class="recuperar-container">
    <div class="recuperar-left">
      <section class="logo-section">
        <img src="../../img/logo/Logotipo_Logo_ModoClaro.png" alt="Logo Spoiler Esperado" class="logo">
      </section>
    </div>
    <div class="recuperar-right">
      <form id="codigoForm">
        <h2>Recuperação de Senha</h2>
        <p>Agora insira o código:</p>
        <div class="codigo">
          <input maxlength="1"><input maxlength="1"><input maxlength="1"><input maxlength="1"><input maxlength="1">
        </div>
        <p id="timer">00:30s Reenviar código AJUSTAR</p>
        <button type="button" onclick="validarCodigo()">Confirmar</button>
      </form>
    </div>
  </div>
  <script src="../js/recuperar.js"></script>
</body>
</html>
