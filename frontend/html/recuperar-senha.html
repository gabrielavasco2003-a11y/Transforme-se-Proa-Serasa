<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Senha</title>
  <link rel="stylesheet" href="../css/recuperar-senha.css">
</head>
<body>
  <div class="recuperar-container">
    <div class="recuperar-left">
      <section class="logo-section">
        <img src="../../img/logo/Logotipo_Logo_ModoClaro.png" alt="Logo Spoiler Esperado" class="logo">
      </section>
    </div>
    <div class="recuperar-right">
      <form id="senhaForm">
        <h2>Recuperação de Senha</h2>
        <p>Insira sua nova senha:</p>
        <input type="password" id="novaSenha" placeholder="Digite sua nova senha" required>
        <input type="password" id="confirmaSenha" placeholder="Confirme sua nova senha" required>
        <button type="button" onclick="salvarSenha()">Confirmar</button>
      </form>
    </div>
  </div>
  <script src="../js/recuperar.js"></script>
</body>
</html>
