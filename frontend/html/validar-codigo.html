<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validação de Telefone</title>
  <link rel="stylesheet" href="../css/validar-codigo.css">
</head>
<body>
<header role="banner">
    <!-- Logo -->
    <a href="/index.html" id="logo" aria-label="Página inicial - Spoiler Esperado">
        <img src="/img/logo/Logotipo_Logo_ModoClaro.png" alt="Logo Spoiler Esperado">
    </a>

    <!-- Busca centralizada -->
    <form id="search-form" action="/busca.html" method="get" role="search">
        <label for="search-input" class="sr-only">Buscar livros</label>
        <input
            type="search"
            name="q"
            id="search-input"
            placeholder="Insira palavras-chave"
            aria-label="Buscar livros"
        >
        <button type="submit">Pesquisar</button>
    </form>

    <!-- Navegação para visitantes (não logados) -->
    <nav id="nav-visitante" aria-label="Navegação de visitante">
        <ul>
            <li><a href="/cadastro.html">Cadastro</a></li>
            <li><a href="/login.html">Login</a></li>
        </ul>
    </nav>

    <!-- Menu do usuário logado (escondido por padrão; JS mostra se logado) -->
    <nav id="user-menu" class="hidden" hidden aria-label="Menu do usuário">
        <button
            id="avatar"
            type="button"
            aria-haspopup="true"
            aria-expanded="false"
            aria-controls="dropdown"
            aria-label="Abrir menu do usuário"
        >
            <span id="avatar-initial" aria-hidden="true">?</span>
        </button>

        <ul id="dropdown" class="hidden" role="menu" hidden>
            <li role="none"><a href="/shelf.html" role="menuitem">Minha Estante</a></li>
            <li role="none"><a href="/perfil.html" role="menuitem">Meu Perfil</a></li>
            <li role="none"><a href="/editar-perfil.html" role="menuitem">Editar Perfil</a></li>
            <li role="none"><a href="/conquistas.html" role="menuitem">Minhas Conquistas</a></li>
            <li role="none"><a href="#" id="logout" role="menuitem">Logout</a></li>
        </ul>
    </nav>
</header>
  <div class="validar-container">
    <div class="validar-left">
      <section class="logo-section">
        <img src="../../img/logo/Logotipo_Logo_ModoClaro.png" alt="Logo Spoiler Esperado" class="logo">
      </section>
    </div>
    <div class="validar-right">
      <form id="codigoTelefoneForm">
        <h2>Validação de Telefone</h2>
        <p>Insira o código recebido:</p>
        <div class="codigo">
          <input maxlength="1"><input maxlength="1"><input maxlength="1"><input maxlength="1"><input maxlength="1">
        </div>
        <p id="timer">00:30s Reenviar código AJUSTAR</p>
        <button type="button" onclick="validarCodigoTelefone()">Confirmar</button>
      </form>
    </div>
  </div>
  <footer>
    <div id="logo-footer">
        <img src="/img/logo/Logo.svg" alt="Logo Spoiler Esperado">
    </div>
    <ul>
        <li><a href="#">Quem somos</a></li>
        <li><a href="#">Termos e serviços</a></li>
        <li><a href="#">Política de privacidade</a></li>
        <li><a href="#">Fale conosco</a></li>
    </ul>
</footer>
  <script src="../js/validar.js"></script>
</body>
</html>
