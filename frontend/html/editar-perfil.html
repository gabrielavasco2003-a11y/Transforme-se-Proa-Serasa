<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Edição de Perfil - Spoiler Esperado</title>
    <!-- CSS correto -->
     <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="../css/editar-perfil.css">
</head>
<body>
<header role="banner">
    <!-- Logo -->
    <a href="/index.html" id="logo" aria-label="Página inicial - Spoiler Esperado">
        <img src="/img/logo/Logotipo_Logo_ModoClaro.png" alt="Logo Spoiler Esperado">
    </a>

    <!-- Busca centralizada -->
    <form id="search-form" action="/busca.html" method="get" role="search">
        <label for="search-input" class="sr-only">Buscar livros</label>
        <input
            type="search"
            name="q"
            id="search-input"
            placeholder="Insira palavras-chave"
            aria-label="Buscar livros"
        >
        <button type="submit" id="search-btn">Pesquisar</button>
    </form>

    <!-- Navegação para visitantes (não logados) -->
    <nav id="nav-visitante" aria-label="Navegação de visitante">
        <ul>
            <li><a href="/cadastro.html">Cadastro</a></li>
            <li><a href="/login.html">Login</a></li>
        </ul>
    </nav>

    <!-- Menu do usuário logado -->
    <nav id="user-menu" class="hidden" hidden aria-label="Menu do usuário">
        <!-- Avatar: SÓ ABRE -->
        <button
            id="avatar"
            type="button"
            aria-haspopup="true"
            aria-expanded="false"
            aria-controls="dropdown"
            aria-label="Abrir menu do usuário"
            onclick="
                event.preventDefault();
                var d = document.getElementById('dropdown');
                var a = document.getElementById('avatar');
                if (!d) return;
                d.classList.remove('hidden');
                d.hidden = false;
                d.style.display = 'block';
                if (a) a.setAttribute('aria-expanded', 'true');
            "
        >
            <span id="avatar-initial" aria-hidden="true">?</span>
        </button>

        <!-- Dropdown -->
        <ul id="dropdown" class="hidden" role="menu" hidden>
            <!-- Botão X: SÓ FECHA -->
            <li role="none" class="dropdown-close-item">
                <button
                    id="fechar-dropdown"
                    type="button"
                    class="dropdown-close"
                    aria-label="Fechar menu"
                    onclick="
                        event.preventDefault();
                        event.stopPropagation();
                        var d = document.getElementById('dropdown');
                        var a = document.getElementById('avatar');
                        if (d) {
                            d.classList.add('hidden');
                            d.hidden = true;
                            d.style.display = 'none';
                        }
                        if (a) a.setAttribute('aria-expanded', 'false');
                    "
                >✕</button>
            </li>
<li role="none"><a href="/adicionar-livro.html" role="menuitem">➕ Adicionar Livro</a></li>
            <li role="none"><a href="/shelf.html" role="menuitem">Minha Estante</a></li>
            <li role="none"><a href="/perfil.html" role="menuitem">Meu Perfil</a></li>
            <li role="none"><a href="/editar-perfil.html" role="menuitem">Editar Perfil</a></li>
            <li role="none"><a href="/conquistas.html" role="menuitem">Minhas Conquistas</a></li>
            <li role="none"><a href="#" id="logout" role="menuitem">Logout</a></li>
        </ul>
    </nav>
</header>
    <main>
        <section id="editar-perfil">
            <h2>EDIÇÃO PERFIL</h2>

            <div class="editar-container">
                <!-- Avatar -->
                <div class="avatar-section">
                    <div id="avatar"></div>
                    <button id="alterar-foto">Alterar</button>
                </div>

                <!-- Formulário ao lado -->
                <form id="form-editar" class="form-section">
                    <div class="form-group">
                        <label for="username">Nome de usuário:</label>
                        <input type="text" id="username" name="username" placeholder="Nome de usuário...">
                    </div>

                    <div class="form-group">
                        <label for="nome">Nome:</label>
                        <input type="text" id="nome" name="nome" placeholder="Nome...">
                    </div>

                    <div class="form-group">
                        <label for="email">E-mail:</label>
                        <input type="email" id="email" name="email" placeholder="E-mail...">
                    </div>

                    <div class="form-group">
                        <label for="senha">Senha:</label>
                        <input type="password" id="senha" name="senha" placeholder="Senha...">
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="confirmar">Confirmar</button>
                        <button type="button" id="excluir-conta">Excluir conta</button>
                    </div>
                </form>
            </div>
        </section>
    </main>

<footer>
    <div id="logo-footer">
        <img src="/img/logo/Logo.svg" alt="Logo Spoiler Esperado">
    </div>
    <ul>
<li><a href="/quem-somos.html">Quem somos</a></li>
<li><a href="/termos-servicos.html">Termos e serviços</a></li>
<li><a href="/politica-privacidade.html">Política de privacidade</a></li>
<li><a href="/fale-conosco.html">Fale conosco</a></li>
    </ul>
</footer>

    <!-- JS correto -->
     <script src="/js/offline.js"></script>
<script src="/js/script.js"></script>
    <script src="../js/editar-perfil.js"></script>
</body>
</html>
