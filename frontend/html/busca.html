<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Spoiler Esperado - Busca</title>
  <link rel="stylesheet" href="../css/busca.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="logo">
        <img src="../../img/logo/Logotipo_Logo_ModoClaro.png" alt="Spoiler Esperado" />
      </div>

      <form id="search-form" class="search-bar" autocomplete="off" role="search">
        <input id="search-input" name="q" type="search" placeholder="Procure por título, autor..." aria-label="Pesquisar livros" />
        <button type="submit" id="search-button">Pesquisar</button>
      </form>

      <nav class="top-nav">
        <a href="cadastro.html">Cadastro</a>
        <a href="login.html">Login</a>
      </nav>
    </div>
  </header>

  <main class="page-main">
    <aside id="filters" class="filters" aria-label="Filtros de busca">
      <h3>Filtro</h3>

      <section class="filter-block">
        <label class="filter-label">Avaliação</label>
        <div id="rating-filter" class="stars" role="radiogroup" aria-label="Filtrar por avaliação">
          <button class="star-btn" data-value="1" aria-pressed="false">★</button>
          <button class="star-btn" data-value="2" aria-pressed="false">★</button>
          <button class="star-btn" data-value="3" aria-pressed="false">★</button>
          <button class="star-btn" data-value="4" aria-pressed="false">★</button>
          <button class="star-btn" data-value="5" aria-pressed="false">★</button>
        </div>
      </section>

      <section class="filter-block">
        <label class="filter-label">Gêneros (adicionar)</label>
        <div class="category-input">
          <input id="category-search" type="text" placeholder="Pesquisar gêneros..." aria-label="Pesquisar gêneros" />
          <button id="add-category" type="button">Adicionar</button>
        </div>
        <ul id="include-categories" class="category-list" aria-live="polite"></ul>
        <div id="category-suggestions" class="suggestions" hidden></div>
      </section>

      <section class="filter-block">
        <label class="filter-label">Excluir categorias</label>
        <div class="category-input">
          <input id="exclude-search" type="text" placeholder="Pesquisar para excluir..." aria-label="Pesquisar categorias para excluir" />
          <button id="add-exclude" type="button">Excluir</button>
        </div>
        <ul id="exclude-categories" class="category-list" aria-live="polite"></ul>
        <div id="exclude-suggestions" class="suggestions" hidden></div>
      </section>

      <section class="filter-block">
        <label class="filter-label">Autor</label>
        <input id="author-filter" type="text" placeholder="Nome do autor" />
      </section>

      <section class="filter-block">
        <label class="filter-label">Ano</label>
        <input id="year-filter" type="number" placeholder="Ex: 2020" min="0" />
      </section>

      <div class="filter-actions">
        <button id="apply-filters" type="button">Aplicar filtros</button>
        <button id="clear-filters" type="button" class="secondary">Remover filtros</button>
      </div>
    </aside>

    <section id="results" class="results">
      <div class="results-header">
        <h2 id="results-title">Sugestões</h2>
        <div id="top-category" class="top-category">Livros em alta: <span id="top-category-name">—</span></div>
      </div>

      <div id="books-container" class="books-grid" aria-live="polite"></div>
      <div id="loading" class="loading" hidden>Carregando...</div>
      <div id="no-results" class="no-results" hidden>Nenhum resultado encontrado.</div>
    </section>
  </main>

  <footer class="site-footer">
    <ul>
      <li><a href="#">Quem somos</a></li>
      <li><a href="#">Termos e serviços</a></li>
      <li><a href="#">Política de privacidade</a></li>
      <li><a href="#">Dúvidas frequentes</a></li>
      <li><a href="#">Contato</a></li>
      <li><a href="#">Suporte</a></li>
      <li><a href="#">Redes sociais</a></li>
    </ul>
  </footer>

  <script src="../js/busca.js" defer></script>
</body>
</html>
