<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário</title>
    <!-- CSS está em frontend/css -->
     <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="../css/cadastro.css">
</head>
<body>
<header role="banner">
    <!-- Logo -->
    <a href="/index.html" id="logo" aria-label="Página inicial - Spoiler Esperado">
        <img src="/img/logo/Logotipo_Logo_ModoClaro.png" alt="Logo Spoiler Esperado">
    </a>

    <!-- Busca centralizada -->
    <form id="search-form" action="/busca.html" method="get" role="search">
        <label for="search-input" class="sr-only">Buscar livros</label>
        <input
            type="search"
            name="q"
            id="search-input"
            placeholder="Insira palavras-chave"
            aria-label="Buscar livros"
        >
        <button type="submit" id="search-btn">Pesquisar</button>
    </form>

    <!-- Navegação para visitantes (não logados) -->
    <nav id="nav-visitante" aria-label="Navegação de visitante">
        <ul>
            <li><a href="/cadastro.html">Cadastro</a></li>
            <li><a href="/login.html">Login</a></li>
        </ul>
    </nav>

    <!-- Menu do usuário logado -->
    <nav id="user-menu" class="hidden" hidden aria-label="Menu do usuário">
        <!-- Avatar: SÓ ABRE -->
        <button
            id="avatar"
            type="button"
            aria-haspopup="true"
            aria-expanded="false"
            aria-controls="dropdown"
            aria-label="Abrir menu do usuário"
            onclick="
                event.preventDefault();
                var d = document.getElementById('dropdown');
                var a = document.getElementById('avatar');
                if (!d) return;
                d.classList.remove('hidden');
                d.hidden = false;
                d.style.display = 'block';
                if (a) a.setAttribute('aria-expanded', 'true');
            "
        >
            <span id="avatar-initial" aria-hidden="true">?</span>
        </button>

        <!-- Dropdown -->
        <ul id="dropdown" class="hidden" role="menu" hidden>
            <!-- Botão X: SÓ FECHA -->
            <li role="none" class="dropdown-close-item">
                <button
                    id="fechar-dropdown"
                    type="button"
                    class="dropdown-close"
                    aria-label="Fechar menu"
                    onclick="
                        event.preventDefault();
                        event.stopPropagation();
                        var d = document.getElementById('dropdown');
                        var a = document.getElementById('avatar');
                        if (d) {
                            d.classList.add('hidden');
                            d.hidden = true;
                            d.style.display = 'none';
                        }
                        if (a) a.setAttribute('aria-expanded', 'false');
                    "
                >✕</button>
            </li>
<li role="none"><a href="/adicionar-livro.html" role="menuitem">➕ Adicionar Livro</a></li>
            <li role="none"><a href="/shelf.html" role="menuitem">Minha Estante</a></li>
            <li role="none"><a href="/perfil.html" role="menuitem">Meu Perfil</a></li>
            <li role="none"><a href="/editar-perfil.html" role="menuitem">Editar Perfil</a></li>
            <li role="none"><a href="/conquistas.html" role="menuitem">Minhas Conquistas</a></li>
              <li role="none"><a href="/configuracoes.html" role="menuitem">Configurações</a></li>
            <li role="none"><a href="#" id="logout" role="menuitem">Logout</a></li>
        </ul>
    </nav>
</header>
    <div class="cadastro-container">
        <div class="cadastro-left">
            <section class="login-left">
                <!-- Imagem está em Projeto/img -->
                <img src="../../img/logo/Logotipo_Logo_ModoClaro.png" alt="Logo Spoiler Esperado" class="logo">
            </section>
        </div>
        <div class="cadastro-right">
            <form id="cadastroForm">
                <label>Nome completo</label>
                <input type="text" name="nome" required>

                <label>Nome de usuário</label>
                <input type="text" name="usuario" required>

                <label>Endereço de e-mail</label>
                <input type="email" name="email" required>

                <label>Confirmar e-mail</label>
                <input type="email" name="confirmarEmail" required>

                <label>Telefone</label>
                <input type="tel" name="telefone">

                <label>Data de nascimento</label>
                <input type="date" name="nascimento" required>

                <label>Senha</label>
                <input type="password" name="senha" required>

                <label>Confirmar senha</label>
                <input type="password" name="confirmarSenha" required>

                <label>Pergunta dica da senha</label>
                <input type="text" name="perguntaSenha" required>

                <div class="checkboxes">
                    <label><input type="checkbox" id="termos"> Li e concordo com os Termos e Condições*</label>
                    <label><input type="checkbox" id="regras"> Li e concordo com as Regras da comunidade*</label>
                    <label><input type="checkbox" id="marketing"> Concordo em receber e-mails e marketing</label>
                </div>

                <button type="submit">Confirmar</button>
            </form>

            <!-- Botão de login com Google -->
            <div class="google-login">
                <button type="button" onclick="loginGoogle()">
                    Entrar com Google
                </button>
            </div>
        </div>
    </div>
    <footer>
    <div id="logo-footer">
        <img src="/img/logo/Logo.svg" alt="Logo Spoiler Esperado">
    </div>
    <ul>
<li><a href="/quem-somos.html">Quem somos</a></li>
<li><a href="/termos-servicos.html">Termos e serviços</a></li>
<li><a href="/politica-privacidade.html">Política de privacidade</a></li>
<li><a href="/fale-conosco.html">Fale conosco</a></li>
    </ul>
</footer>
<script src="/js/theme.js"></script>
<script src="/js/offline.js"></script>
<script src="/js/script.js"></script>
    <script src="../js/cadastro.js"></script>
</body>
</html>
