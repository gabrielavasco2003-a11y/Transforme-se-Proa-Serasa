<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário</title>
    <link rel="stylesheet" href="cadastro.css">
</head>
<body>
    <div class="cadastro-container">
        <div class="cadastro-left">
        <section class="login-left">
            <img src="img/logo/Logotipo_Logo_ModoClaro.png" alt="Logo Spoiler Esperado" class="logo">
        </section>
        </div>
        <div class="cadastro-right">
            <form id="cadastroForm">
                <label>Nome completo</label>
                <input type="text" name="nome" required>

                <label>Nome de usuário</label>
                <input type="text" name="usuario" required>

                <label>Endereço de e-mail</label>
                <input type="email" name="email" required>

                <label>Confirmar e-mail</label>
                <input type="email" name="confirmarEmail" required>

                <label>Telefone</label>
                <input type="tel" name="telefone">

                <label>Data de nascimento</label>
                <input type="date" name="nascimento" required>

                <label>Senha</label>
                <input type="password" name="senha" required>

                <label>Confirmar senha</label>
                <input type="password" name="confirmarSenha" required>

                <label>Pergunta dica da senha</label>
                <input type="text" name="perguntaSenha" required>

                <div class="checkboxes">
                    <label><input type="checkbox" id="termos"> Li e concordo com os Termos e Condições*</label>
                    <label><input type="checkbox" id="regras"> Li e concordo com as Regras da comunidade*</label>
                    <label><input type="checkbox" id="marketing"> Concordo em receber e-mails e marketing</label>
                </div>

                <button type="submit">Confirmar</button>
            </form>
        </div>
    </div>
    <script src="cadastro.js"></script>
</body>
</html>
